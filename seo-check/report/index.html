<script>
(function(){

    return String(t == null ? '' : t)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  /* 우리가 쓴 <b> 만 살린다. 점검한 사이트에서 온 값(제목 · 설명문 등)에는 쓰지 않는다 */
  function 굵게만(t){
    return esc(t).split('&lt;b&gt;').join('<b>').split('&lt;/b&gt;').join('</b>');
  }

  var 상태글 = { fail:'고쳐야 함', warn:'주의', ok:'통과', info:'확인 못 함' };
  var 아이콘 = {
    ok:   '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',

  function 색(v){ return v >= 90 ? '#0E8F83' : (v >= 70 ? '#B7770A' : '#D6431F'); }
  function 평(v, 엔진){
    if(v >= 90) return '기본기가 잘 갖춰져 있습니다. 이제 글과 후기를 쌓을 차례입니다.';

    if(v >= 55) return '검색에 걸리기는 하지만 손해를 보고 있습니다. 붉은 항목부터 고쳐야 합니다.';

  /* 점검 서버가 항목마다 매긴 가중치(구글 · 네이버)의 합으로 「영향」을 말한다 */

  function 머리(R, id){

    return '<div class="doc-head"><div class="no">REPORT No. <b>' + esc(String(id).toUpperCase()) + '</b>' +
      (R.점검시각 ? ' · 점검 ' + esc(R.점검시각) : '') + '</div>' +
      '<h1>홈페이지 SEO 점검 리포트</h1>' +

      '<div class="tg"><span class="k">점검 대상</span><b class="u">' + esc(R.url) + '</b>' +
      '<span class="m' + (소스 ? ' src' : '') + '">' + (소스 ? '붙여넣은 소스 기준' : '주소를 직접 점검') + '</span></div>';
  }
  function 점수칸(R){
    function 칸(이름, v, 엔진){ return '<div class="sc">' + 링(v) + '<h3>' + 이름 + '</h3><p>' + esc(평(v, 엔진)) + '</p></div>'; }
    return '<div class="scores">' + 칸('Google 최적화', R.점수.google, '구글') + 칸('Naver 최적화', R.점수.naver, '네이버') + '</div>';
  }
  function 요약(R, 수){
    var 글 = '총 <b>' + R.항목.length + '개</b> 항목 중 ' + 수.ok + '개 통과 · ' + 수.warn + '개 주의 · ' + 수.fail + '개 고쳐야 함' +

  function 고칠것(문제){
    if(!문제.length) return '';
    return '<h2>개선할 항목 <em class="f">' + 문제.length + '가지</em> — 우선순위 순</h2><ol class="fixes">' +
      문제.map(function(it, i){
        var 영 = 영향(it);
        return '<li class="fix s-' + esc(it.상태) + '"><div class="rank">' + (i + 1) + '</div><div class="fx">' +
          '<div class="fh"><b class="nm">' + esc(it.이름) + '</b><span class="tag ' + esc(it.상태) + '">' + 상태글[it.상태] + '</span>' +
          (영 ? '<span class="imp">' + 영 + '</span>' : '') + '</div>' +
          '<div class="cur">현재 상태 <b>' + esc(it.값) + '</b></div>' +
          (it.설명 ? '<p class="why">' + esc(it.설명) + '</p>' : '') +
          (it.처방 ? '<div class="how"><span class="hk">고치는 법</span>' + 굵게만(it.처방) + '</div>' : '') +
          '</div></li>';
      }).join('') + '</ol>';
  }
  function 키워드(k){
    if(!k) return '';
    function 칸(라벨, 참){
      return '<div><span>' + esc(라벨) + '</span><b class="' + (참 ? 'y' : 'n') + '">' + (참 ? '들어있음' : '없음') + '</b></div>';
    }
    return '<h2>검색 키워드 점검 <em class="i">' + esc(k.말) + '</em></h2><div class="kwl">' +
      칸('페이지 제목', k.title) + 칸('검색 설명문', k.desc) + 칸('대표 제목(h1)', k.h1) +
      '<div><span>본문 등장</span><b class="' + (k.본문 > 0 ? 'y' : 'n') + '">' + (k.본문 || 0) + '회</b></div></div>';
  }
  function 잘된것(통과){
    if(!통과.length) return '';
    return '<h2>잘 되어 있는 항목 <em class="o">' + 통과.length + '가지</em></h2><ul class="oks">' +
      통과.map(function(it){
        return '<li><span class="dot ok">' + 아이콘.ok + '</span><span class="n">' + esc(it.이름) + '</span><span class="v">' + esc(it.값) + '</span></li>';
      }).join('') + '</ul>';
  }
  function 못본것(보류){
    if(!보류.length) return '';
    return '<h2>확인하지 못한 항목 <em class="i">' + 보류.length + '가지</em></h2><ul class="infos">' +
      보류.map(function(it){
        return '<li><span class="dot info">' + 아이콘.info + '</span><div><div class="n">' + esc(it.이름) + '</div><div class="d">' +
          굵게만(it.처방 || it.설명) + '</div></div></li>';
      }).join('') + '</ul>';
  }
  function 상담(R, id, 수){
    var 본 = ['[SEO 점검 리포트 상담]', '리포트 번호 : ' + String(id).toUpperCase(), '사이트 : ' + R.url,
      '점수 : 구글 ' + R.점수.google + ' / 네이버 ' + R.점수.naver, '', '성함/상호 : ', '연락 가능한 시간 : '].join(String.fromCharCode(10));
    var 구분 = /iPhone|iPad|iPod|Mac/i.test(navigator.userAgent) ? '&' : '?';
    var 문자 = 'sms:' + SMS_TO.replace(/[^0-9+]/g, '') + 구분 + 'body=' + encodeURIComponent(본);
    var 있음 = 수.fail + 수.warn > 0;
    return '<div class="cta"><h3>' + (있음 ? '이 항목들, <em>저희가 고쳐 드립니다</em>' : '다음 단계도 <em>함께 하겠습니다</em>') + '</h3>' +
      '<p>큰길브리지는 홈페이지 제작 · 검색 설정(SEO) · 홍보영상을 함께 하는 업체입니다. ' +
      (있음 ? '위에 적힌 항목을 우선순위대로 정리해 비용과 일정을 먼저 안내해 드립니다.' : '글과 후기를 쌓아 순위를 올리는 방법을 안내해 드립니다.') + '</p>' +
      '<div class="acts no-print"><a class="btn btn-gold" href="' + 문자 + '">문자로 상담 신청</a>' +
      '<a class="btn" href="tel:1533-7295">' + TEL + ' 전화</a><a class="btn" href="../../#price">요금 · 견적 보기</a></div>' +
      '<p class="print-only" style="margin-top:10px">상담 · 문의 ' + TEL + ' · ' + SMS_TO + ' · www.ai-make.co.kr</p></div>';
  }
  function 안내(){
    return '<h2>점검 방법과 안내</h2><ul class="terms">' +
      '<li>자동 점검 도구가 공개된 웹 페이지(또는 붙여넣은 소스)를 읽어 24개 항목을 확인한 결과입니다. 로그인이 필요한 화면은 점검하지 않습니다.</li>' +
      '<li>점수는 검색 순위 그 자체가 아니라 기본기를 갖췄는지 보는 지표입니다. 순위를 보장하거나 예측하지 않습니다.</li>' +
      '<li>구글 소유확인처럼 페이지 밖에서는 확인할 수 없는 항목은 「확인 못 함」으로 두고 점수에서 뺍니다.</li>' +
      '<li>점검한 시점의 상태입니다. 사이트를 고치면 결과가 달라지니, 고친 뒤에 다시 점검해 보세요.</li></ul>' +
      '<div class="doc-foot"><span><b>큰길브리지</b> · (주)브리지미디어 · 대표 김효민</span>' +
      '<span>사업자등록번호 813-81-02252 · 대표번호 ' + TEL + '</span></div>';
  }

  function 그리기(R, id){
    var 문제 = R.항목.filter(function(it){ return it.상태 === 'fail' || it.상태 === 'warn'; }).sort(비교);
    var 통과 = R.항목.filter(function(it){ return it.상태 === 'ok'; });
    var 보류 = R.항목.filter(function(it){ return it.상태 === 'info'; });
    var 수 = {
      ok: 통과.length, info: 보류.length,
      fail: 문제.filter(function(it){ return it.상태 === 'fail'; }).length,
      warn: 문제.filter(function(it){ return it.상태 === 'warn'; }).length
    };
    $('#doc').innerHTML = 머리(R, id) + 점수칸(R) + 요약(R, 수) + 고칠것(문제) + 키워드(R.키워드) +
      잘된것(통과) + 못본것(보류) + 상담(R, id, 수) + 안내();
    $('#state').hidden = true;
    $('#doc').hidden = false;
    $('#after').hidden = false;
    $('#btnPrint').hidden = false;
    /* PDF 로 저장할 때 파일 이름이 되도록 제목에 주소를 넣는다 */
    try { document.title = String(R.url).split('//').pop().split('/')[0] + ' SEO 점검 리포트 — 큰길브리지'; } catch(e){}
  }

  function 오류(제목, 설명, 다시){
    var s = $('#state');
    s.hidden = false;
    $('#doc').hidden = true;
    s.innerHTML = '<b>' + esc(제목) + '</b><br>' + esc(설명) +
      '<div class="acts"><a class="btn btn-gold" href="../">무료 점검 해보기</a>' +
      '<a class="btn" href="tel:1533-7295">' + TEL + ' 전화</a>' +
      (다시 ? '<button class="btn" id="retry" type="button">다시 불러오기</button>' : '') + '</div>';
    if(다시) $('#retry').addEventListener('click', 불러오기);
  }

  var id = (new URLSearchParams(location.search).get('r') || '').toLowerCase();

  function 불러오기(){
    if(!/^[0-9a-f]{10}$/.test(id)){
      오류('리포트 주소를 확인해 주세요', '리포트 번호가 없거나 올바르지 않습니다. 보내 드린 링크를 그대로 열어 주세요.');
      return;
    }
    $('#state').hidden = false;
    $('#state').innerHTML = '<span class="spin"></span>리포트를 불러오는 중입니다…';
    fetch(CHECK_ENDPOINT + '?report=' + encodeURIComponent(id))
      .then(function(r){ return r.json(); })
      .then(function(r){
        if(r && r.ok && r.result && r.result.항목 && r.result.항목.length && r.result.점수){ 그리기(r.result, id); return; }
        if(r && r.notFound){
          오류('리포트를 찾을 수 없습니다', '오래되어 정리되었거나 주소가 잘못되었을 수 있습니다. 새로 점검하시면 같은 리포트를 다시 받으실 수 있습니다.');
        }else{
          오류('리포트를 불러오지 못했습니다', (r && r.error) || '잠시 뒤에 다시 열어 주세요.', true);
        }
      })
      .catch(function(){
        오류('리포트를 불러오지 못했습니다', '인터넷 연결을 확인하고 다시 열어 주세요. 계속 안 되면 ' + TEL + ' 로 연락 주세요.', true);
      });
  }

  $('#btnPrint').addEventListener('click', function(){ window.print(); });
  불러오기();

  /* 테스트용 출입구 — 서버 없이 화면 그리는 부분만 볼 때 쓴다 */
  window.__report = { 그리기: 그리기 };
})();
</script>
</body>
</html>
