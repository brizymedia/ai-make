<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>홈페이지 기획서 — 큰길브리지</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/*
  자동 기획서.
  사장님 이야기를 칸에 채우면 기획서가 바로 나온다. 서버 없다.
  내용은 주소(#p=) 안에 통째로 담겨서, 링크만 보내면 그 사람도 같은 문서를 본다.

  ?admin=1  → 우리 화면 (왼쪽 칸 + 오른쪽 문서 + 견적서로 넘기기)
  그냥 열면 → 고객 화면 (문서만)
*/
:root{--paper:#FFFFFF;--bg:#F3F2EE;--ink:#1A1A1A;--ink2:#5C5C57;--ink3:#8B8B84;--line:#E2E0D8;--hair:#EDEBE4;
      --acc:#1E5EFF;--acc-soft:#E8EEFF;--gold:#8F6828;--gold-soft:#FBF3E1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,sans-serif;
     font-size:15px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:800;letter-spacing:-.02em}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--acc);display:inline-block}
.mode{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--acc-soft);color:var(--acc);font-weight:700}
.mode.cust{background:var(--gold-soft);color:var(--gold)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;
     font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.layout{max-width:1400px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:22px;align-items:start}
.layout.cust{grid-template-columns:1fr;max-width:900px}
aside{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;position:sticky;top:66px;max-height:calc(100vh - 86px);overflow:auto}
aside h3{margin:16px 0 8px;font-size:12px;letter-spacing:.12em;color:var(--ink3);font-weight:700}
aside h3:first-child{margin-top:0}
label{display:block;font-size:12.5px;color:var(--ink2);margin:10px 0 4px}
input[type=text],input[type=date],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px;background:#fff}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;font-size:13px;cursor:pointer;background:#fff;user-select:none}
.chip input{margin:0}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.plans{display:grid;gap:8px}
.plan{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;align-items:flex-start}
.plan.on{border-color:var(--acc);background:var(--acc-soft)}
.plan b{display:block;font-size:14px}.plan small{color:var(--ink2);font-size:12px}
.plan .pr{margin-left:auto;font-weight:800;white-space:nowrap}
.hint{font-size:12px;color:var(--ink3);margin-top:6px}

/* ── 문서 ── */
.doc{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(22px,4vw,52px);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.cover{border-bottom:2px solid var(--ink);padding-bottom:26px;margin-bottom:30px}
.cover .k{font-size:12px;letter-spacing:.16em;color:var(--ink3);font-weight:700}
.cover h1{font-size:clamp(26px,4.4vw,40px);line-height:1.2;letter-spacing:-.02em;margin:10px 0 12px;text-wrap:balance}
.cover .m{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink2);font-size:13.5px}
.sec{margin:34px 0 0}
.sec .n{font-size:12px;letter-spacing:.14em;color:var(--acc);font-weight:800}
.sec h2{font-size:clamp(19px,2.6vw,24px);margin:6px 0 12px;letter-spacing:-.01em}
.sec p{margin:0 0 10px;color:var(--ink2)}
.lead{font-size:clamp(16px,2.2vw,19px);color:var(--ink);line-height:1.6;padding:16px 20px;background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:0 10px 10px 0}
.tree{list-style:none;padding:0;margin:8px 0 0}
.tree>li{padding:10px 0;border-top:1px solid var(--hair)}
.tree>li:first-child{border-top:0}
.tree b{font-size:15px}
.tree ul{list-style:none;padding:4px 0 0 14px;margin:0;display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink2);font-size:14px}
.tree ul li::before{content:"└ ";color:var(--ink3)}
.tips{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.tips li{padding:10px 14px;background:var(--bg);border-radius:10px;font-size:14px;color:var(--ink)}
.tips li::before{content:"✦ ";color:var(--gold)}
.chk{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.chk li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.chk li::before{content:"";width:16px;height:16px;border:1.5px solid var(--ink3);border-radius:4px;flex:none;margin-top:4px}
.chk li.have::before{background:var(--acc);border-color:var(--acc)}
.tl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin-top:8px;font-size:14.5px}
.tl .d{font-weight:800;white-space:nowrap;color:var(--acc)}
.money{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:16px 20px;border:1px solid var(--line);border-radius:12px;margin-top:8px}
.money .big{font-size:clamp(20px,3vw,26px);font-weight:900;letter-spacing:-.02em}
.money small{color:var(--ink2)}
.cta{margin-top:34px;padding:22px;border-radius:14px;background:var(--ink);color:#fff;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cta b{font-size:17px}.cta .sp{flex:1}
.cta .btn{border-color:transparent}
.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);opacity:0;transition:.25s;background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--ink3);font-style:normal}
@media(max-width:860px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none}}

/* ── 보기 전환 ── */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:#fff}
.seg button{padding:8px 13px;border:0;background:transparent;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
body.v-board .doc{display:none}
body.v-doc .boardwrap,body.v-doc .bhint{display:none}
.bhint{display:none;margin:8px 4px 0;font-size:12.5px;color:var(--ink3)}
@media(max-width:700px){body.v-board .bhint{display:block}}
@media print{.bhint{display:none!important}}
#right{min-width:0}   /* 격자 칸이 1080px 보드에 밀려 늘어나지 않게 — 이게 없으면 zoom 이 1 이 되고 가로 스크롤이 생긴다 */
.boardwrap{overflow:hidden;min-width:0;border-radius:14px;border:1px solid var(--line);background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.02)}

/* ── 보드 (한 장 그림) — 폭 1080 고정, zoom 으로 맞춘다 ── */
.board{--ac:#1E5EFF;--ac2:#E4EBFF;--ac3:#10347D;   /* 색 셋은 JS 가 업종별로 다시 넣는다 (html2canvas 가 color-mix 를 못 읽어서 hex 로) */
  width:1080px;background:#fff;color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",sans-serif;line-height:1.5;position:relative}
.board *{box-sizing:border-box}
.bh{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:start;padding:44px 48px 36px;color:#fff;
  background:linear-gradient(135deg,var(--ac3),var(--ac) 70%,var(--ac4))}   /* --ac4 = 강조색 70% + 금색 30%, JS 가 hex 로 넣는다 (html2canvas 가 color-mix 를 못 읽음) */
.bh .eyebrow{font-size:12.5px;letter-spacing:.18em;font-weight:700;opacity:.85}
.bh h1{font-size:44px;line-height:1.15;letter-spacing:-.03em;margin:10px 0 14px;font-weight:900;text-wrap:balance}
.bh h1 small{display:block;font-size:20px;font-weight:600;opacity:.9;letter-spacing:-.01em;margin-top:6px}
.bh .lead{font-size:16.5px;line-height:1.6;margin:0;opacity:.95;max-width:640px}
.bh .bh-r{text-align:right;font-size:13px;line-height:1.7;opacity:.95;padding-top:4px}
.bh .bh-r b{display:block;font-size:20px;font-weight:900;letter-spacing:-.02em;opacity:1}
.bh .bh-r small{display:block;font-size:10.5px;letter-spacing:.2em;opacity:.7;margin-bottom:12px}
.bin{padding:26px 48px 0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;min-height:96px}
.tile span{display:block;font-size:11.5px;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.tile b{display:block;font-size:15.5px;line-height:1.35;margin-top:6px;letter-spacing:-.01em}
.tile small{display:block;font-size:12px;color:var(--ink2);margin-top:4px}
.tile .gl{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tile .gl i{font-style:normal;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac3);font-weight:600}
.row2{display:grid;grid-template-columns:5fr 7fr;gap:14px;margin-top:14px}
.row2b{display:grid;grid-template-columns:7fr 5fr;gap:14px;margin-top:14px}
.box{border:1px solid var(--line);border-radius:16px;padding:18px 20px 20px;background:#fff;position:relative}
.box h3{margin:0 0 12px;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.box h3 i{font-style:normal;font-size:11px;letter-spacing:.14em;color:var(--ac);font-weight:800}
/* 사이트 구성 */
.smap .root{margin:0 auto;width:fit-content;min-width:150px;text-align:center;padding:10px 18px;border-radius:12px;background:var(--ac);color:#fff;font-weight:800;font-size:15px;position:relative}
.smap .root small{display:block;font-weight:500;font-size:11px;opacity:.85;margin-top:2px}
.smap .root::after{content:"";position:absolute;left:50%;bottom:-18px;width:2px;height:18px;background:var(--ac)}
.smap .kids{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:8px;position:relative;padding-top:18px;margin-top:18px}
.smap .kids::before{content:"";position:absolute;top:0;left:10%;right:10%;height:2px;background:var(--ac)}
.smap .kid{position:relative;border:1.5px solid var(--ac);border-radius:12px;padding:10px 9px 10px;background:var(--ac2);min-height:112px}
.smap .kid::before{content:"";position:absolute;top:-18px;left:50%;width:2px;height:18px;background:var(--ac)}
.smap .kid b{display:block;font-size:13px;letter-spacing:-.01em;color:var(--ac3);margin-bottom:6px}
.smap .kid ul{list-style:none;margin:0;padding:0;font-size:11.5px;color:var(--ink2);line-height:1.5}
.smap .kid li::before{content:"· "}
.smap.one .kids{grid-template-columns:1fr 1fr;gap:8px 10px}
.smap.one .kid{min-height:0;display:flex;gap:9px;align-items:center;padding:9px 11px}
.smap.one .kid::before{display:none}
.smap.one .kids::before{display:none}
.smap.one .kid b{margin:0;font-size:13.5px;color:var(--ink)}
.smap.one .kid .no{width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;flex:none}
.smap .auto{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--gold-soft);font-size:12.5px;color:var(--ink);line-height:1.55}
.smap .auto b{color:var(--gold)}
/* 첫 화면 */
.home{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.home h3{grid-column:1/-1}
.phone{width:250px;height:500px;border-radius:30px;border:6px solid #17181C;background:#F7F7F5;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 14px 34px -18px rgba(0,0,0,.45)}
.ph-top{display:flex;align-items:center;gap:6px;padding:10px 12px 8px;background:#fff;border-bottom:1px solid var(--hair)}
.ph-top i{width:9px;height:9px;border-radius:50%;background:var(--ac)}
.ph-top b{font-size:9.5px;letter-spacing:-.01em;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ph-top s{width:14px;height:8px;border-top:1.5px solid #333;border-bottom:1.5px solid #333;text-decoration:none;position:relative}
.ph-top s::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px solid #333;transform:translateY(-50%)}
.ph-hero{background:linear-gradient(160deg,var(--ac3),var(--ac));color:#fff;padding:16px 13px 14px;min-height:118px;position:relative}
.ph-hero::before{content:"";position:absolute;right:-20px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12)}
.ph-hero em{display:block;font-style:normal;font-size:8.5px;letter-spacing:.16em;opacity:.8}
.ph-hero b{display:block;font-size:13.5px;line-height:1.3;margin:5px 0 8px;letter-spacing:-.02em;text-wrap:balance}
.ph-hero span{display:inline-block;font-size:9px;font-weight:800;padding:5px 10px;border-radius:99px;background:#fff;color:var(--ac3)}
.ph-sec{display:flex;gap:8px;align-items:center;padding:9px 11px;background:#fff;border-bottom:1px solid var(--hair)}
.ph-sec i{width:26px;height:26px;border-radius:7px;background:var(--ac2);flex:none;display:grid;place-items:center;color:var(--ac3);font-size:10px;font-weight:800;font-style:normal}
.ph-sec div{flex:1;min-width:0}
.ph-sec b{display:block;font-size:9.5px;letter-spacing:-.01em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ph-sec u{display:block;height:4px;border-radius:2px;background:#E5E4DE;margin-top:4px;text-decoration:none}
.ph-sec u+u{width:70%;margin-top:3px}
.ph-more{flex:1;display:grid;place-items:center;color:var(--ink3);font-size:9px}
.ph-bar{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;background:#fff;border-top:1px solid var(--hair)}
.ph-bar span{font-size:9px;font-weight:800;text-align:center;padding:7px 4px;border-radius:8px;border:1px solid var(--line);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ph-bar span+span{background:var(--ac);color:#fff;border-color:var(--ac)}
.btips{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.btips li{padding:11px 13px;background:var(--bg);border-radius:12px;font-size:13px;line-height:1.5;color:var(--ink)}
.btips li::before{content:"✦ ";color:var(--ac);font-weight:800}
.btips .cta{background:var(--ac2);color:var(--ac3);font-weight:700}
/* 준비 */
.prep{margin-top:14px}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchips span{display:inline-flex;align-items:center;gap:8px;padding:8px 12px 8px 9px;border:1px solid var(--line);border-radius:99px;font-size:13px;background:#fff}
.pchips span i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink3);display:grid;place-items:center;font-size:11px;font-style:normal;color:var(--ink3);flex:none}
.pchips span.have{border-color:var(--ac);background:var(--ac2)}
.pchips span.have i{background:var(--ac);border-color:var(--ac);color:#fff}
.prep .hint{margin:10px 0 0;font-size:12px;color:var(--ink3)}
/* 일정 */
.steps{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:relative}
.steps::before{content:"";position:absolute;left:12%;right:12%;top:15px;height:2px;background:var(--line)}
.steps li{text-align:center;position:relative;padding-top:38px;font-size:12.5px;line-height:1.45;color:var(--ink2)}
.steps li::before{content:"";position:absolute;left:50%;top:6px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;border:3px solid var(--ac)}
.steps li:last-child::before{background:var(--ac)}
.steps li b{display:block;color:var(--ac3);font-size:14px;margin-bottom:2px}
.steps li:last-child b{color:var(--ac)}
.tl-note{margin:12px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.5}
/* 비용 */
.cost .line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair)}
.cost .line small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.cost .line b{font-size:24px;letter-spacing:-.02em;white-space:nowrap}
.cost .line b small{display:inline;color:var(--ink2);font-size:12px;font-weight:600;margin-left:3px}
.cost .vat{margin:10px 0 0;font-size:11.5px;color:var(--ink3);line-height:1.5}
.cost .badge{position:absolute;top:16px;right:18px;font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 10px;border-radius:99px;background:var(--ac);color:#fff}
/* 마감 */
.bf{margin-top:22px;padding:22px 48px 26px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.bf b{font-size:19px;letter-spacing:-.02em}
.bf .sp{flex:1}
.bf .tel{font-size:24px;font-weight:900;letter-spacing:-.02em;color:#FFD37A}
.bf small{display:block;font-size:11.5px;opacity:.7;margin-top:2px}
@media print{
  @page{size:A4;margin:10mm}
  .topbar,aside,.cta,.toast{display:none!important}.layout{display:block;padding:0}.doc{border:0;box-shadow:none;padding:0}body{background:#fff}
  .boardwrap{border:0;border-radius:0;overflow:visible}.board{zoom:.62!important}   /* A4 한 장(277mm ≈ 1047px)에 1600px 보드가 들어가는 배율 */
}
</style>
  <script defer src="https://www.ai-make.co.kr/stats/stats.js" data-site="ai-make"></script>
</head>
<body>

<div class="topbar"><div class="topbar-in">
  <a class="brand" href="./"><i></i>큰길브리지 <span style="font-weight:500;color:var(--ink3)">· 기획서</span></a>
  <span class="mode" id="mode">작성 화면</span>
  <span class="sp"></span>
  <div class="seg" id="view"><button type="button" data-v="board" aria-pressed="true">🖼 한 장 보기</button><button type="button" data-v="doc" aria-pressed="false">📝 글로 보기</button></div>
  <button class="btn" id="b-link" type="button">🔗 링크 복사</button>
  <button class="btn" id="b-prompt" type="button" title="이 내용으로 Claude 에게 더 다듬어 달라고 할 때">✎ 프롬프트 복사</button>
  <button class="btn" id="b-img" type="button" title="카톡으로 보낼 그림 한 장">⬇ 이미지로 저장</button>
  <button class="btn" id="b-print" type="button">🖨 인쇄 · PDF</button>
  <button class="btn gold" id="b-quote" type="button">📄 이 기획서로 견적서 만들기</button>
</div></div>

<div class="layout" id="layout">
  <aside id="form">
    <h3>업체</h3>
    <label>업종</label>
    <select id="f-biz"></select>

/* 두 색을 섞는다. r = 앞 색의 비율. html2canvas 가 color-mix() 를 못 읽어 직접 계산한다. */
function 섞기(a, b, r){
  var A = parseInt(a.slice(1), 16), Bc = parseInt(b.slice(1), 16), out = '#';
  for (var i = 16; i >= 0; i -= 8) {
    var v = Math.round(((A >> i) & 255) * r + ((Bc >> i) & 255) * (1 - r));
    out += (v < 16 ? '0' : '') + v.toString(16);
  }
  return out;
}
